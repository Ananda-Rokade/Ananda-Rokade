<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&amp;display=swap');
      
      .bg-rect {
        fill: url(#bg);
        stroke: #27272a;
        stroke-width: 2;
      }
      
      .track {
        font-family: 'Fira Code', 'Consolas', 'Courier New', monospace;
        font-size: 28px;
        font-weight: 700;
        fill: #3f3f46;
        white-space: nowrap;
      }
      
      .highlight {
        fill: #F97316;
      }
      
      .highlight-blue {
        fill: #38bdf8;
      }
      
      /* Scrolling Animation */
      .scroll-left {
        animation: scrollL 20s linear infinite;
      }
      
      .scroll-right {
        animation: scrollR 25s linear infinite;
      }
      
      @keyframes scrollL {
        0% { transform: translateX(800px); }
        100% { transform: translateX(-1500px); }
      }
      
      @keyframes scrollR {
        0% { transform: translateX(-1500px); }
        100% { transform: translateX(800px); }
      }
      
      /* Coffee Steam Animation */
      .steam {
        stroke: #a1a1aa;
        stroke-width: 2.5;
        stroke-linecap: round;
        fill: none;
        animation: rise 2s infinite ease-in-out alternate;
      }
      
      @keyframes rise {
        0% { transform: translateY(0) scale(1); opacity: 0.3; }
        100% { transform: translateY(-8px) scale(1.1); opacity: 0; }
      }
      
      /* Typing Animation (Code lines) */
      .code-line {
        animation: pulse 1s infinite alternate;
      }
      
      @keyframes pulse {
        0% { opacity: 0.4; }
        100% { opacity: 1; }
      }

      /* Developer Lifecycle Styles */
      .bg-circle {
        fill: #27272a;
        stroke: #3f3f46;
        stroke-width: 2;
        transition: all 0.3s ease;
      }
      
      .step-text {
        font-family: 'Fira Code', monospace;
        font-size: 14px;
        font-weight: 700;
        fill: #71717a;
      }

      /* Sequential Highlighting */
      .step1 .bg-circle, .step1 .step-text { animation: glow1 8s infinite; }
      .step2 .bg-circle, .step2 .step-text { animation: glow2 8s infinite; }
      .step3 .bg-circle, .step3 .step-text { animation: glow3 8s infinite; }
      .step4 .bg-circle, .step4 .step-text { animation: glow4 8s infinite; }

      @keyframes glow1 { 0%, 20% { fill: #F97316; stroke: #F97316; } 25%, 100% { } }
      @keyframes glow2 { 0%, 20% { } 25%, 45% { fill: #F97316; stroke: #F97316; } 50%, 100% { } }
      @keyframes glow3 { 0%, 45% { } 50%, 70% { fill: #F97316; stroke: #F97316; } 75%, 100% { } }
      @keyframes glow4 { 0%, 70% { } 75%, 95% { fill: #F97316; stroke: #F97316; } 100% { } }

      /* Override text fill when glowing */
      @keyframes glow1 { 0%, 20% { fill: #F97316; } } /* The circle uses the one above, we need a separate for text if we want... wait, fill applies to both circle and text if we use the same keyframe. */
      
      /* Let's refine the keyframes for stroke and fill */
      @keyframes circleGlow1 { 0%, 20% { stroke: #F97316; } 25%, 100% { stroke: #3f3f46; } }
      @keyframes textGlow1 { 0%, 20% { fill: #F97316; } 25%, 100% { fill: #71717a; } }
      
      @keyframes circleGlow2 { 0%, 20% { stroke: #3f3f46; } 25%, 45% { stroke: #F97316; } 50%, 100% { stroke: #3f3f46; } }
      @keyframes textGlow2 { 0%, 20% { fill: #71717a; } 25%, 45% { fill: #F97316; } 50%, 100% { fill: #71717a; } }
      
      @keyframes circleGlow3 { 0%, 45% { stroke: #3f3f46; } 50%, 70% { stroke: #F97316; } 75%, 100% { stroke: #3f3f46; } }
      @keyframes textGlow3 { 0%, 45% { fill: #71717a; } 50%, 70% { fill: #F97316; } 75%, 100% { fill: #71717a; } }
      
      @keyframes circleGlow4 { 0%, 70% { stroke: #3f3f46; } 75%, 95% { stroke: #F97316; } 100% { stroke: #3f3f46; } }
      @keyframes textGlow4 { 0%, 70% { fill: #71717a; } 75%, 95% { fill: #F97316; } 100% { fill: #71717a; } }

      .step1 .bg-circle { animation: circleGlow1 6s infinite; }
      .step1 .step-text { animation: textGlow1 6s infinite; }
      .step2 .bg-circle { animation: circleGlow2 6s infinite; }
      .step2 .step-text { animation: textGlow2 6s infinite; }
      .step3 .bg-circle { animation: circleGlow3 6s infinite; }
      .step3 .step-text { animation: textGlow3 6s infinite; }
      .step4 .bg-circle { animation: circleGlow4 6s infinite; }
      .step4 .step-text { animation: textGlow4 6s infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg-rect" width="100%" height="100%" rx="15" />

  <!-- Top Marquee -->
  <g transform="translate(0, 50)">
    <text class="track scroll-left" y="0">
      <tspan class="highlight">JAVA</tspan> • SPRING BOOT • <tspan class="highlight">DSA</tspan> • MERN STACK • POWER BI • SQL • <tspan class="highlight">JAVA</tspan> • SPRING BOOT • <tspan class="highlight">DSA</tspan> • MERN STACK
    </text>
  </g>

  <!-- Bottom Marquee -->
  <g transform="translate(0, 175)">
    <text class="track scroll-right" y="0">
      SYSTEM ARCHITECTURE • <tspan class="highlight-blue">REST APIs</tspan> • DATA ANALYTICS • MICROSERVICES • <tspan class="highlight-blue">REST APIs</tspan> • DATA ANALYTICS
    </text>
  </g>

  <!-- Center Graphic: Developer Lifecycle (Wake -> Code -> Coffee -> Sleep) -->
  <g transform="translate(180, 75)">
    
    <!-- Connecting Line -->
    <line x1="40" y1="20" x2="400" y2="20" stroke="#27272a" stroke-width="4" stroke-linecap="round"/>

    <!-- Scene 1: Wake Up (Bed) -->
    <g class="step1" transform="translate(0, 0)">
      <circle cx="20" cy="20" r="35" class="bg-circle" />
      <text x="20" y="28" font-size="24" text-anchor="middle">🛌</text>
      <text x="20" y="70" class="step-text" text-anchor="middle">WAKE</text>
    </g>

    <text x="95" y="27" font-size="20" fill="#52525b" font-weight="bold">→</text>

    <!-- Scene 2: Code (Laptop) -->
    <g class="step2" transform="translate(140, 0)">
      <circle cx="20" cy="20" r="35" class="bg-circle" />
      <text x="20" y="28" font-size="24" text-anchor="middle">💻</text>
      <text x="20" y="70" class="step-text" text-anchor="middle">CODE</text>
    </g>

    <text x="235" y="27" font-size="20" fill="#52525b" font-weight="bold">→</text>

    <!-- Scene 3: Coffee (Mug) -->
    <g class="step3" transform="translate(280, 0)">
      <circle cx="20" cy="20" r="35" class="bg-circle" />
      <text x="20" y="28" font-size="24" text-anchor="middle">☕</text>
      <text x="20" y="70" class="step-text" text-anchor="middle">COFFEE</text>
    </g>

    <text x="375" y="27" font-size="20" fill="#52525b" font-weight="bold">→</text>

    <!-- Scene 4: Sleep (Zzz) -->
    <g class="step4" transform="translate(420, 0)">
      <circle cx="20" cy="20" r="35" class="bg-circle" />
      <text x="20" y="28" font-size="24" text-anchor="middle">😴</text>
      <text x="20" y="70" class="step-text" text-anchor="middle">SLEEP</text>
    </g>

  </g>
</svg>
