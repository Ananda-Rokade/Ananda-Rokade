<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&amp;display=swap');
      
      .bg-rect {
        fill: url(#bg);
        stroke: #27272a;
        stroke-width: 2;
      }
      
      .track {
        font-family: 'Fira Code', 'Consolas', 'Courier New', monospace;
        font-size: 28px;
        font-weight: 700;
        fill: #3f3f46;
        white-space: nowrap;
      }
      
      .highlight {
        fill: #F97316;
      }
      
      .highlight-blue {
        fill: #38bdf8;
      }
      
      /* Scrolling Animation */
      .scroll-left {
        animation: scrollL 20s linear infinite;
      }
      
      .scroll-right {
        animation: scrollR 25s linear infinite;
      }
      
      @keyframes scrollL {
        0% { transform: translateX(800px); }
        100% { transform: translateX(-1500px); }
      }
      
      @keyframes scrollR {
        0% { transform: translateX(-1500px); }
        100% { transform: translateX(800px); }
      }
      
      /* Coffee Steam Animation */
      .steam {
        stroke: #a1a1aa;
        stroke-width: 2.5;
        stroke-linecap: round;
        fill: none;
        animation: rise 2s infinite ease-in-out alternate;
      }
      
      @keyframes rise {
        0% { transform: translateY(0) scale(1); opacity: 0.3; }
        100% { transform: translateY(-8px) scale(1.1); opacity: 0; }
      }
      
      /* Typing Animation (Code lines) */
      .code-line {
        animation: pulse 1s infinite alternate;
      }
      
      @keyframes pulse {
        0% { opacity: 0.4; }
        100% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg-rect" width="100%" height="100%" rx="15" />

  <!-- Top Marquee -->
  <g transform="translate(0, 50)">
    <text class="track scroll-left" y="0">
      <tspan class="highlight">JAVA</tspan> • SPRING BOOT • <tspan class="highlight">DSA</tspan> • MERN STACK • POWER BI • SQL • <tspan class="highlight">JAVA</tspan> • SPRING BOOT • <tspan class="highlight">DSA</tspan> • MERN STACK
    </text>
  </g>

  <!-- Bottom Marquee -->
  <g transform="translate(0, 175)">
    <text class="track scroll-right" y="0">
      SYSTEM ARCHITECTURE • <tspan class="highlight-blue">REST APIs</tspan> • DATA ANALYTICS • MICROSERVICES • <tspan class="highlight-blue">REST APIs</tspan> • DATA ANALYTICS
    </text>
  </g>

  <!-- Center Graphic: Laptop and Coffee -->
  <g transform="translate(320, 70)">
    <!-- Desk line -->
    <line x1="-80" y1="65" x2="230" y2="65" stroke="#27272a" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Laptop -->
    <!-- Screen -->
    <rect x="0" y="0" width="100" height="60" rx="4" fill="#27272a" stroke="#3f3f46" stroke-width="2"/>
    <!-- Base -->
    <path d="M -15 60 L 115 60 Q 120 60 118 65 L -12 65 Q -15 60 -15 60" fill="#a1a1aa" />
    
    <!-- Code on Screen -->
    <rect x="10" y="10" width="30" height="4" rx="2" fill="#f43f5e" class="code-line" style="animation-delay: 0.1s" />
    <rect x="45" y="10" width="40" height="4" rx="2" fill="#10b981" class="code-line" style="animation-delay: 0.2s" />
    
    <rect x="15" y="20" width="50" height="4" rx="2" fill="#38bdf8" class="code-line" style="animation-delay: 0.3s" />
    
    <rect x="15" y="30" width="20" height="4" rx="2" fill="#fbbf24" class="code-line" style="animation-delay: 0.4s" />
    <rect x="40" y="30" width="45" height="4" rx="2" fill="#F97316" class="code-line" style="animation-delay: 0.5s" />
    
    <rect x="10" y="40" width="60" height="4" rx="2" fill="#a855f7" class="code-line" style="animation-delay: 0.6s" />
    
    <!-- Coffee Mug -->
    <g transform="translate(130, 35)">
      <!-- Mug body -->
      <rect x="0" y="0" width="25" height="30" rx="3" fill="#F97316" />
      <!-- Handle -->
      <path d="M 25 5 Q 35 5 35 15 Q 35 25 25 25" fill="none" stroke="#F97316" stroke-width="4" />
      <!-- Coffee label/stripe -->
      <rect x="0" y="15" width="25" height="5" fill="#ea580c" />
      
      <!-- Steam -->
      <path d="M 5 -5 Q 0 -15 10 -20" class="steam" />
      <path d="M 15 -2 Q 25 -10 12 -18" class="steam" style="animation-delay: 0.5s" />
      <path d="M 20 -8 Q 15 -18 22 -22" class="steam" style="animation-delay: 1s" />
    </g>
  </g>
</svg>
